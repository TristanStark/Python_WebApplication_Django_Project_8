<!-- templates/base.html -->

{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}LITReview{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/litreview.css' %}">
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="header-title">LITReview</div>

            {% if user.is_authenticated %}
                <nav class="nav">
                    <a href="{% url 'feed' %}">Feed</a>
                    <a href="{% url 'posts' %}">Posts</a>
                    <a href="{% url 'following' %}">Following</a>
                    <form method="post" action="{% url 'logout' %}" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-button">Log out</button>
                    </form>
                </nav>
            {% endif %}
        </header>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
