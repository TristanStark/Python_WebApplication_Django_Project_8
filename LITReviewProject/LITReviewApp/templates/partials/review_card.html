<!-- templates/partials/review_card.html -->

<div class="card">
    <div class="card-header">
        <span>{{ review.user.username }} posted a review</span>
        <span>{{ review.time_created }}</span>
    </div>

    <div class="card-body">
        <h2 class="card-title">
            {{ review.headline }}
            <span class="rating">★★★★★</span>
        </h2>

        <p class="card-text">{{ review.body }}</p>

        {% if review.ticket %}
            <div class="nested-card">
                <div class="card-header">
                    <span>Ticket - {{ review.ticket.user.username }}</span>
                </div>

                <div class="card-body">
                    <h3 class="card-title">{{ review.ticket.title }}</h3>

                    {% if review.ticket.image %}
                        <img
                            class="card-image"
                            src="{{ review.ticket.image.url }}"
                            alt="{{ review.ticket.title }}"
                        >
                    {% endif %}
                </div>
            </div>
        {% endif %}
    </div>
</div>
