<!-- templates/partials/review_card.html -->
<div class="card modern-card review-card">
    <div class="card-meta">
        <span class="badge badge-review">Review</span>
        <span>{{ review.user.username }} · {{ review.time_created }}</span>
    </div>

    <div class="card-body">
        <h2 class="card-title">
            {{ review.headline }}
            <span class="rating-pill">★ {{ review.rating|default:"-" }}/5</span>
        </h2>

        <p class="card-text">{{ review.body }}</p>

        {% if review.ticket %}
            <div class="nested-card nested-ticket">
                {% if review.ticket.image %}
                    <img class="card-image small" src="{{ review.ticket.image.url }}" alt="{{ review.ticket.title }}">
                {% endif %}

                <div>
                    <span class="muted-small">Ticket - {{ review.ticket.user.username }}</span>
                    <h3>{{ review.ticket.title }}</h3>
                </div>
            </div>
        {% endif %}
    </div>
</div>
