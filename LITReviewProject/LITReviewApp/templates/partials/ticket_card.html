<!-- templates/partials/ticket_card.html -->

<div class="card">
    <div class="card-header">
        <span>{{ ticket.user.username }} requested a review</span>
        <span>{{ ticket.time_created }}</span>
    </div>

    <div class="card-body">
        <h2 class="card-title">{{ ticket.title }}</h2>

        {% if ticket.description %}
            <p class="card-text">{{ ticket.description }}</p>
        {% endif %}

        {% if ticket.image %}
            <img class="card-image" src="{{ ticket.image.url }}" alt="{{ ticket.title }}">
        {% endif %}
    </div>

    {% if show_review_button %}
        <div class="card-actions">
            <a class="btn" href="{% url 'review_create_for_ticket' ticket.id %}">
                Post a Review
            </a>
        </div>
    {% endif %}
</div>
