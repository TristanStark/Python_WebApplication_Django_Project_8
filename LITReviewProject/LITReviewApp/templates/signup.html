<!-- templates/signup.html -->
{% extends "base.html" %}

{% block title %}Inscription - LITReview{% endblock %}

{% block content %}
<section class="auth-centered">
    <div class="panel auth-panel auth-panel-wide">
        <div class="panel-heading text-center">
            <p class="eyebrow">New account</p>
            <h1>Sign Up</h1>
            <p class="muted">Create your profile to request and publish reviews.</p>
        </div>

        {% if error %}
            <p class="form-error">{{ error }}</p>
        {% endif %}

        <form method="post" class="stacked-form">
            {% csrf_token %}

            <label class="field">
                <span>Username</span>
                <input class="input" type="text" name="username" placeholder="Your username" autocomplete="username">
            </label>

            <label class="field">
                <span>Password</span>
                <input class="input" type="password" name="password1" placeholder="Minimum 8 characters" autocomplete="new-password">
            </label>

            <label class="field">
                <span>Confirm Password</span>
                <input class="input" type="password" name="password2" placeholder="Confirm your password" autocomplete="new-password">
            </label>

            <div class="button-row split">
                <a href="{% url 'landing' %}" class="btn btn-secondary">Back</a>
                <button class="btn btn-primary" type="submit">Create Account</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
