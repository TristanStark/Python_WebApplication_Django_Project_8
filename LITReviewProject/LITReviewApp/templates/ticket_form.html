<!-- templates/ticket_form.html -->

{% extends "base.html" %}

{% block title %}
    {% if ticket %}Edit Your Ticket{% else %}Create a Ticket{% endif %}
{% endblock %}

{% block content %}
<h1 class="page-title">
    {% if ticket %}Edit Your Ticket{% else %}Create a Ticket{% endif %}
</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_title">Title</label>
        <input
            class="input"
            type="text"
            id="id_title"
            name="title"
            value="{{ ticket.title|default:'' }}"
        >
    </div>

    <div class="form-group">
        <label for="id_description">Description</label>
        <textarea
            class="textarea"
            id="id_description"
            name="description"
        >{{ ticket.description|default:'' }}</textarea>
    </div>

    <div class="form-group">
        <label>Image</label>

        {% if ticket.image %}
            <img class="current-image" src="{{ ticket.image.url }}" alt="{{ ticket.title }}">
        {% endif %}

        <label class="file-button">
            {% if ticket.image %}Upload New File{% else %}Upload File{% endif %}
            <input type="file" name="image">
        </label>
    </div>

    <div class="button-row">
        <button class="btn btn-large" type="submit">Submit</button>
    </div>
</form>
{% endblock %}
