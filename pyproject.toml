[project]
name = "project-8"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.14",
    "flake8>=3.8.4",
    "flake9>=3.8.3.post2",
    "pillow>=12.2.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "migrations",
    ".venv",
    "venv",
    "__pycache__",
    "db.sqlite3",
    "settings.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = []
